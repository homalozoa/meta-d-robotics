# D-Robotics RDK X5 BSP layer for OpenEmbedded/Yocto Wrynose.
BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "d-robotics"
BBFILE_PATTERN_d-robotics = "^${LAYERDIR}/"
BBFILE_PRIORITY_d-robotics = "7"

# Keep paths used by reusable classes stable even when another layer is the
# current recipe's owner.
D_ROBOTICS_LAYERDIR := "${LAYERDIR}"

LAYERVERSION_d-robotics = "1"
LAYERDEPENDS_d-robotics = "core"
LAYERSERIES_COMPAT_d-robotics = "wrynose"
