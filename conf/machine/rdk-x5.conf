#@TYPE: Machine
#@NAME: D-Robotics RDK X5
#@DESCRIPTION: RDK X5 development board with the RDKOS 3.5.0 boot contract.

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/include/rdk-x5-release.inc

SOC_FAMILY = "x5"
MACHINEOVERRIDES =. "d-robotics:${SOC_FAMILY}:rdk-x5:"

MACHINE_FEATURES = "alsa bluetooth ext2 pci screen serial usbhost vfat wifi"

PREFERRED_PROVIDER_virtual/kernel = "linux-d-robotics"

KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "hobot/x5-rdk.dtb hobot/x5-rdk-v1p0.dtb"
KERNEL_DTBDEST = "boot/hobot"

SERIAL_CONSOLES = "115200;ttyS0"

# Keep the boot script in every RDK X5 root filesystem.  The accompanying
# image layout supplies its CONFIG FAT partition separately, without changing
# the bootloader that remains in persistent storage on the board.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-image kernel-devicetree d-robotics-bootfiles hobot-usb-gadget"
